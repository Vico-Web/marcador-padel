<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Widgets pádel (OBS)</title>
<meta name="viewport" content="width=1920">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="widgets.css">
<style>html,body{margin:0;background:transparent;overflow:hidden}#stage{position:absolute;left:0;top:0;transform-origin:0 0}body.prueba{background:#2a6fd6 linear-gradient(160deg,#1f4fa8,#2f7be0)}</style>
</head><body>
<!-- Fuente web 1920x1080, fondo transparente. Lienzo fijo de 1920x1080 px como el marcador; ?escala=0.5 para otro tamaño y ?fondo para probar. -->
<div id="stage"></div>
<script src="widgets.js"></script>
<script>
{
  const st=document.getElementById('stage');
  const w=PadelWidgets.montar(st);
  const q=new URLSearchParams(location.search),k=parseFloat(q.get('escala'));
  if(k>0&&k!==1)st.style.transform=`scale(${k})`;
  if(q.has('fondo'))document.body.classList.add('prueba');
  window.aplicarEstado=e=>w.aplicar(e);
  PadelWidgets.escuchar(e=>w.aplicar(e));
}
</script>
</body></html>
